# Configuração da CLI do Supabase (supabase start / db push / functions deploy).
# `project_id` é sobrescrito por `supabase link --project-ref <ref>`.
project_id = "portal-receitas"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 16

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = true

# Provedores OAuth (preencha os secrets via variáveis de ambiente da CLI).
[auth.external.google]
enabled = false
[auth.external.github]
enabled = false

[storage]
enabled = true
