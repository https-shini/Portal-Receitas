# ════════════════════════════════════════════════════════════════
# Cabeçalhos de segurança HTTP aplicados a todas as respostas.
# CSP: apenas a própria origem (fontes/ícones são self-hosted); iframes
# permitidos somente para o YouTube em modo de privacidade reforçada.
# 'unsafe-inline' em script/style é aceito conscientemente (snippet de
# tema pré-paint, JSON-LD e handlers inline) — ainda bloqueia qualquer
# script/estilo de origem externa.
# ════════════════════════════════════════════════════════════════
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
Header always set X-Frame-Options "DENY"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
# HSTS: efetivo apenas quando servido via HTTPS (ignorado em HTTP puro)
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
