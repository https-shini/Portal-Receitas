# ════════════════════════════════════════════════════════════════
# Blueprint da Render (https://render.com/docs/blueprint-spec).
# Deploy: Dashboard → New → Blueprint → apontar para este repositório.
#
# Modo FREE (padrão): um único serviço web com Apache/PHP + MariaDB no
# mesmo container (docker/render-free.Dockerfile), custo zero e sem
# variáveis obrigatórias. Limitação do plano free (sem disco): dados de
# runtime são efêmeros — receitas e demos sempre voltam pelo seed.
# Alternativas com persistência: DEPLOY.md.
# ════════════════════════════════════════════════════════════════
services:
  - type: web
    name: portal-receitas
    runtime: docker
    plan: free
    dockerfilePath: ./docker/render-free.Dockerfile
    dockerContext: .
    healthCheckPath: /healthz.php
