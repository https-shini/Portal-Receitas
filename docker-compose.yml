services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: tcc_receitas
      DB_USER: root
      DB_PASS: ${DB_PASS:-rootpass}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-rootpass}
      MYSQL_DATABASE: tcc_receitas
    volumes:
      # Importa o seed automaticamente na PRIMEIRA subida (banco vazio)
      - ./DB_Receitas.sql:/docker-entrypoint-initdb.d/DB_Receitas.sql:ro
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASS:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  dbdata:
