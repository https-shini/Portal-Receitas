# ════════════════════════════════════════════════════════════════
# Ambiente local/VPS: aplicação (web) + MySQL 8 (db) com persistência.
# Variáveis WEB_PORT e DB_PASS podem vir de um arquivo .env (ver .env.example).
# Deploy na Render NÃO usa este arquivo — ver render.yaml e DEPLOY.md.
# ════════════════════════════════════════════════════════════════
services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: tcc_receitas
      DB_USER: root
      DB_PASS: ${DB_PASS:-rootpass}
    depends_on:
      # A aplicação só sobe depois do MySQL responder ao healthcheck,
      # evitando 503 na primeira carga.
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-rootpass}
      MYSQL_DATABASE: tcc_receitas
    volumes:
      # O seed só é importado quando o volume dbdata está vazio (primeira
      # subida). Para reimportar após mudar o SQL: docker compose down -v.
      - ./DB_Receitas.sql:/docker-entrypoint-initdb.d/DB_Receitas.sql:ro
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASS:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  dbdata:
