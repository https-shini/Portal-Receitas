# ════════════════════════════════════════════════════════════════
# Ambiente local/VPS: aplicação (web) + MySQL 8 (db) com persistência.
# Variáveis WEB_PORT e DB_PASS podem vir de um arquivo .env (ver .env.example).
# Deploy na Render NÃO usa este arquivo — ver render.yaml e DEPLOY.md.
# ════════════════════════════════════════════════════════════════
services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: tcc_receitas
      DB_USER: root
      DB_PASS: ${DB_PASS:-rootpass}
    depends_on:
      # A aplicação só sobe depois do MySQL responder ao healthcheck,
      # evitando 503 na primeira carga.
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-rootpass}
      MYSQL_DATABASE: tcc_receitas
    volumes:
      # O seed só é importado quando o volume dbdata está vazio (primeira
      # subida). Para reimportar após mudar o SQL: docker compose down -v.
      - ./database/DB_Receitas.sql:/docker-entrypoint-initdb.d/DB_Receitas.sql:ro
      - dbdata:/var/lib/mysql
    healthcheck:
      # Consulta uma tabela do seed via TCP (127.0.0.1, não socket): só fica
      # "healthy" quando o servidor DEFINITIVO já está na rede E a importação
      # do seed terminou. O antigo `mysqladmin ping` pela socket ficava verde
      # ainda durante o init (servidor temporário), liberando a web cedo demais
      # e causando 503 na primeira carga.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"${DB_PASS:-rootpass}\" -e 'SELECT 1 FROM tcc_receitas.receita LIMIT 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

volumes:
  dbdata:
